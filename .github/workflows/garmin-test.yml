
name: Garmin Integration Check

on:
  push:
    branches:
      - feature/garmin-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Run tests
        run: npm test
